<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShadowCC</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }

    .hero {
      padding: 80px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .shop-button {
      display: inline-block;
      background: white;
      color: black;
      padding: 14px 25px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    .products {
      padding: 40px 20px;
    }

    .products h2 {
      margin-bottom: 25px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product {
      background: #151515;
      border-radius: 10px;
      overflow: hidden;
      padding-bottom: 15px;
    }

    .product-image {
      height: 220px;
      background: #242424;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .price {
      color: #aaa;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">SHADOWCC</div>

    <nav>
      <a href="#">Shop</a>
      <a href="#">Cart</a>
    </nav>
  </header>

  <section class="hero">
    <h1>SHADOWCC</h1>
    <p>Simple pieces. Everyday wear.</p>
    <a href="#shop" class="shop-button">SHOP NOW</a>
  </section>

  <section class="products" id="shop">
    <h2>Featured</h2>

    <div class="product-grid">

      <div class="product">
        <div class="product-image">
          PRODUCT IMAGE
        </div>

        <div class="product-info">
          <h3>Classic Hoodie</h3>
          <p class="price">$40.00</p>
        </div>
      </div>

      <div class="product">
        <div class="product-image">
          PRODUCT IMAGE
        </div>

        <div class="product-info">
          <h3>Essential Hoodie</h3>
          <p class="price">$45.00</p>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
